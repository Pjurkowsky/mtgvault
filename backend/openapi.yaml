components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    ActionEnum:
      enum:
      - move
      - edit
      - delete
      type: string
      description: |-
        * `move` - move
        * `edit` - edit
        * `delete` - delete
    AddFromCollection:
      type: object
      properties:
        deck:
          type: integer
        zone:
          allOf:
          - $ref: '#/components/schemas/ZoneEnum'
          default: main
        selection:
          $ref: '#/components/schemas/Selection'
      required:
      - deck
      - selection
    AddResult:
      type: object
      properties:
        cards:
          type: integer
          description: Distinct cards added
      required:
      - cards
    ApplySwap:
      type: object
      properties:
        out:
          type: integer
          description: The deck card it replaces
      required:
      - out
    AuthResponse:
      type: object
      description: Body returned by register and login. The refresh token goes in
        a cookie.
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - user
    Binder:
      type: object
      properties:
        rows:
          type: integer
        cols:
          type: integer
        spread:
          type: boolean
        pages:
          type: integer
          nullable: true
          description: Fixed page count, or null
        page_count:
          type: integer
          description: Pages to show
        used:
          type: integer
          description: Pockets holding a card
        total:
          type: integer
          nullable: true
          description: Pockets in a binder with a fixed page count
        sections:
          type: array
          items:
            $ref: '#/components/schemas/BinderSectionRead'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/BinderSlot'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
          description: The binder's rows
        unplaced:
          type: array
          items:
            $ref: '#/components/schemas/Unplaced'
        currency:
          type: string
        unplaced_now:
          type: integer
          description: 'After a settings change: cards that lost their slot'
      required:
      - cols
      - currency
      - items
      - page_count
      - pages
      - rows
      - sections
      - slots
      - spread
      - total
      - unplaced
      - used
    BinderCursor:
      type: object
      description: 'Scan in order: where the next card goes, and which way the scan
        moves (AC-20).'
      properties:
        page:
          type: integer
          maximum: 500
          minimum: 1
        row:
          type: integer
          maximum: 6
          minimum: 1
        col:
          type: integer
          maximum: 6
          minimum: 1
        direction:
          allOf:
          - $ref: '#/components/schemas/DirectionEnum'
          default: rows
      required:
      - col
      - page
      - row
    BinderMove:
      type: object
      properties:
        slot:
          type: integer
          description: Move this placed card
        item:
          type: integer
          description: Or place one of this row's unplaced copies
        to:
          allOf:
          - $ref: '#/components/schemas/BinderPlace'
          nullable: true
          description: 'null: back to Unplaced'
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          default: swap
          description: |-
            When the target slot is taken

            * `swap` - swap
            * `share` - share
      required:
      - to
    BinderOrder:
      type: object
      description: 'A pocket: page, row and column, all from 1.'
      properties:
        page:
          type: integer
          maximum: 500
          minimum: 1
        row:
          type: integer
          maximum: 6
          minimum: 1
        col:
          type: integer
          maximum: 6
          minimum: 1
        slots:
          type: array
          items:
            type: integer
          description: Slot ids, top first
      required:
      - col
      - page
      - row
      - slots
    BinderPlace:
      type: object
      description: 'A pocket: page, row and column, all from 1.'
      properties:
        page:
          type: integer
          maximum: 500
          minimum: 1
        row:
          type: integer
          maximum: 6
          minimum: 1
        col:
          type: integer
          maximum: 6
          minimum: 1
      required:
      - col
      - page
      - row
    BinderSection:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
        first_page:
          type: integer
          maximum: 500
          minimum: 1
        last_page:
          type: integer
          maximum: 500
          minimum: 1
        filter:
          type: object
          additionalProperties: {}
          description: 'Card browser filter keys: color, type, rarity, set, finish,
            condition, price_min, price_max'
      required:
      - first_page
      - last_page
      - name
    BinderSectionRead:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
        first_page:
          type: integer
          maximum: 500
          minimum: 1
        last_page:
          type: integer
          maximum: 500
          minimum: 1
        filter:
          type: object
          additionalProperties: {}
          description: 'Card browser filter keys: color, type, rarity, set, finish,
            condition, price_min, price_max'
        matching:
          type: array
          items:
            type: integer
          readOnly: true
          nullable: true
          description: Ids of the binder's rows that match the filter; null without
            one
      required:
      - first_page
      - last_page
      - matching
      - name
    BinderSlot:
      type: object
      properties:
        id:
          type: integer
        item:
          type: integer
        page:
          type: integer
        row:
          type: integer
        col:
          type: integer
        position:
          type: integer
          description: Order in a shared pocket; the highest is on top
        mismatch:
          type: boolean
          description: Outside its section's filter
      required:
      - col
      - id
      - item
      - mismatch
      - page
      - position
      - row
    BlankEnum:
      enum:
      - ''
    BoxEnum:
      enum:
      - keep
      - unfile
      - delete
      type: string
      description: |-
        * `keep` - keep
        * `unfile` - unfile
        * `delete` - delete
    BoxMove:
      type: object
      properties:
        item_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
      required:
      - item_id
      - quantity
    BulkChanges:
      type: object
      properties:
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        language:
          $ref: '#/components/schemas/LanguageEnum'
        finish:
          $ref: '#/components/schemas/FinishEnum'
    BulkRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        selection:
          $ref: '#/components/schemas/Selection'
        location:
          type: integer
          nullable: true
          description: Target for move; null = Unfiled
        changes:
          $ref: '#/components/schemas/BulkChanges'
        dry_run:
          type: boolean
          default: false
      required:
      - action
      - selection
    BulkResult:
      type: object
      properties:
        rows:
          type: integer
        cards:
          type: integer
        skipped:
          type: integer
          description: Rows left unchanged (e.g. finish not available)
      required:
      - cards
      - rows
      - skipped
    BundleInfo:
      type: object
      properties:
        version:
          type: string
        created:
          type: string
        gallery:
          type: object
          additionalProperties: {}
        constants:
          type: object
          additionalProperties: {}
        files:
          type: object
          additionalProperties:
            type: string
        sizes:
          type: object
          additionalProperties:
            type: integer
      required:
      - constants
      - created
      - files
      - gallery
      - sizes
      - version
    CanCommand:
      type: object
      properties:
        commander:
          type: boolean
        brawl:
          type: boolean
      required:
      - brawl
      - commander
    CardDetail:
      type: object
      properties:
        oracle_id:
          type: string
          format: uuid
        name:
          type: string
        owned:
          type: integer
          description: Copies the viewer owns across printings (0 when logged out)
        wanted:
          type: integer
          description: Copies on the viewer's want list (spec 010, AC-4)
        printings:
          type: array
          items:
            $ref: '#/components/schemas/Printing'
      required:
      - name
      - oracle_id
      - owned
      - printings
      - wanted
    CardSearchResult:
      type: object
      properties:
        oracle_id:
          type: string
          format: uuid
        name:
          type: string
        image_small:
          type: string
        image_normal:
          type: string
      required:
      - image_normal
      - image_small
      - name
      - oracle_id
    CardsEnum:
      enum:
      - move
      - unfile
      - delete
      type: string
      description: |-
        * `move` - move
        * `unfile` - unfile
        * `delete` - delete
    CatalogStatus:
      type: object
      properties:
        prices_updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - prices_updated_at
    CategorySuggestions:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
      required:
      - categories
    ColorEnum:
      enum:
      - W
      - U
      - B
      - R
      - G
      - C
      type: string
      description: |-
        * `W` - W
        * `U` - U
        * `B` - B
        * `R` - R
        * `G` - G
        * `C` - C
    Combo:
      type: object
      properties:
        id:
          type: string
        cards:
          type: array
          items:
            $ref: '#/components/schemas/ComboCard'
        produces:
          type: array
          items:
            type: string
        infinite:
          type: boolean
        wins:
          type: boolean
        prerequisites:
          type: string
        description:
          type: string
        requires:
          type: array
          items:
            type: string
          description: Pieces that are not one named card
        url:
          type: string
          description: The combo on Commander Spellbook
      required:
      - cards
      - description
      - id
      - infinite
      - prerequisites
      - produces
      - requires
      - url
      - wins
    ComboCard:
      type: object
      properties:
        oracle_id:
          type: string
          format: uuid
        name:
          type: string
        image:
          type: string
        in_deck:
          type: boolean
        owned:
          type: boolean
          description: A missing card the viewer has in their collection
        printing:
          type: string
          format: uuid
          nullable: true
          description: Newest printing, to add a missing card
      required:
      - image
      - in_deck
      - name
      - oracle_id
      - owned
      - printing
    ConditionEnum:
      enum:
      - NM
      - LP
      - MP
      - HP
      - DMG
      type: string
      description: |-
        * `NM` - Near Mint
        * `LP` - Lightly Played
        * `MP` - Moderately Played
        * `HP` - Heavily Played
        * `DMG` - Damaged
    Counts:
      type: object
      properties:
        commander:
          type: integer
        main:
          type: integer
        side:
          type: integer
        maybe:
          type: integer
        size:
          type: integer
          description: Commander + Mainboard
        target:
          type: integer
          nullable: true
          description: The format's deck size
        owned:
          type: integer
        missing:
          type: integer
      required:
      - commander
      - main
      - maybe
      - missing
      - owned
      - side
      - size
      - target
    CreateBox:
      type: object
      properties:
        moves:
          type: array
          items:
            $ref: '#/components/schemas/BoxMove'
    CurrencyEnum:
      enum:
      - USD
      - EUR
      - PLN
      type: string
      description: |-
        * `USD` - US Dollar
        * `EUR` - Euro
        * `PLN` - Polish Złoty
    DeckCard:
      type: object
      properties:
        id:
          type: integer
        zone:
          $ref: '#/components/schemas/ZoneEnum'
        quantity:
          type: integer
        printing:
          $ref: '#/components/schemas/DeckPrinting'
        price:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        prices:
          $ref: '#/components/schemas/Money'
        ownership:
          $ref: '#/components/schemas/Ownership'
        swap_for:
          type: array
          items:
            type: integer
          description: Deck cards this Maybeboard card could replace (spec 021, AC-13)
        categories:
          type: array
          items:
            type: string
          description: Your names for the card; the first is primary
      required:
      - categories
      - id
      - ownership
      - price
      - prices
      - printing
      - quantity
      - swap_for
      - zone
    DeckCardWrite:
      type: object
      properties:
        printing:
          type: string
          format: uuid
          description: Scryfall id
        quantity:
          type: integer
          maximum: 999
          minimum: 1
          default: 1
        zone:
          allOf:
          - $ref: '#/components/schemas/ZoneEnum'
          default: main
      required:
      - printing
    DeckCombos:
      type: object
      description: Spec 022, AC-7, AC-8.
      properties:
        in_deck:
          type: array
          items:
            $ref: '#/components/schemas/Combo'
        could_build:
          type: array
          items:
            $ref: '#/components/schemas/Combo'
          description: Infinite or win combos missing one or two cards
      required:
      - could_build
      - in_deck
    DeckDelete:
      type: object
      properties:
        box:
          $ref: '#/components/schemas/BoxEnum'
    DeckDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        format:
          $ref: '#/components/schemas/FormatEnum'
        is_public:
          type: boolean
        location:
          type: integer
          nullable: true
        location_name:
          type: string
          nullable: true
        image:
          type: string
        counts:
          $ref: '#/components/schemas/Counts'
        value:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        values:
          $ref: '#/components/schemas/Money'
        username:
          type: string
        currency:
          type: string
        cards:
          type: array
          items:
            $ref: '#/components/schemas/DeckCard'
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/DeckToken'
          description: Made by Commander, Mainboard and Sideboard cards, one per kind
            (spec 015)
        legality:
          $ref: '#/components/schemas/Legality'
        stats:
          $ref: '#/components/schemas/Stats'
        combo_count:
          type: integer
          description: Combos fully in the counted cards (spec 022, AC-6)
      required:
      - cards
      - combo_count
      - counts
      - currency
      - format
      - id
      - image
      - is_public
      - legality
      - location
      - location_name
      - name
      - stats
      - tokens
      - username
      - value
      - values
    DeckImportPreview:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DeckImportRow'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportError'
        cards:
          type: integer
      required:
      - cards
      - errors
      - rows
    DeckImportRow:
      type: object
      properties:
        line:
          type: integer
        zone:
          type: string
        quantity:
          type: integer
        printing:
          $ref: '#/components/schemas/PrintingBrief'
        categories:
          type: array
          items:
            type: string
          description: 'From #tags on the line'
      required:
      - categories
      - line
