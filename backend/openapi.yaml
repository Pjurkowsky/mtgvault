openapi: 3.0.3
info:
  title: MTG Vault API
  version: 0.1.0
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          description: Wrong username/email or password.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Swap the refresh cookie for a new access token and a rotated cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          description: Not logged in
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/catalog/cards/:
    get:
      operationId: catalog_cards_list
      description: Card names matching `q`, one entry per card (not per printing).
      parameters:
      - in: query
        name: q
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardSearchResult'
          description: ''
  /api/catalog/cards/{oracle_id}/:
    get:
      operationId: catalog_cards_retrieve
      description: A card with its printings and how many copies the viewer owns.
      parameters:
      - in: path
        name: oracle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDetail'
          description: ''
  /api/catalog/cards/{oracle_id}/edhrec/:
    get:
      operationId: catalog_cards_edhrec_retrieve
      description: 'EDHREC tabs for a card, cached 24 h. Never fails: no data = available
        false.'
      parameters:
      - in: path
        name: oracle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edhrec'
          description: ''
  /api/catalog/cards/{oracle_id}/printings/:
    get:
      operationId: catalog_cards_printings_list
      parameters:
      - in: path
        name: oracle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Printing'
          description: ''
  /api/catalog/printings/{printing_id}/tokens/:
    get:
      operationId: catalog_printings_tokens_list
      description: Tokens, emblems and markers a printing makes, one per kind (spec
        015, AC-7).
      parameters:
      - in: path
        name: printing_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Token'
          description: ''
  /api/catalog/sets/:
    get:
      operationId: catalog_sets_list
      parameters:
      - in: query
        name: q
        schema:
          type: string
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Set'
          description: ''
  /api/catalog/status/:
    get:
      operationId: catalog_status_retrieve
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogStatus'
          description: ''
  /api/catalog/tokens/{token_id}/printings/:
    get:
      operationId: catalog_tokens_printings_list
      description: Every printing of a token's kind, newest first, with prices (spec
        021, AC-10).
      parameters:
      - in: path
        name: token_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TokenPrinting'
          description: ''
  /api/decks/:
    get:
      operationId: decks_list
      tags:
      - decks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckList'
          description: ''
    post:
      operationId: decks_create
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeckWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeckWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
  /api/decks/{id}/:
    get:
      operationId: decks_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
    patch:
      operationId: decks_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDeckWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDeckWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDeckWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
  /api/decks/{id}/box/:
    post:
      operationId: decks_box_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBox'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateBox'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateBox'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
  /api/decks/{id}/cards/:
    post:
      operationId: decks_cards_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckCardWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeckCardWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeckCardWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
  /api/decks/{id}/cards/{card_id}/:
    patch:
      operationId: decks_cards_partial_update
      parameters:
      - in: path
        name: card_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDeckCardEdit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDeckCardEdit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDeckCardEdit'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
    delete:
      operationId: decks_cards_destroy
      parameters:
      - in: path
        name: card_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/decks/{id}/cards/{card_id}/apply-swap/:
    post:
      operationId: decks_cards_apply_swap_create
      description: 'Spec 005 AC-11, spec 021 AC-17: one copy goes in, that copy of
        the old card becomes its candidate.'
      parameters:
      - in: path
        name: card_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplySwap'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplySwap'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplySwap'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
  /api/decks/{id}/cards/{card_id}/own/:
    post:
      operationId: decks_cards_own_create
      description: 'AC-15: move a free copy into the deck box, or record a new copy.'
      parameters:
      - in: path
        name: card_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkOwned'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarkOwned'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkOwned'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
  /api/decks/{id}/cards/{card_id}/swaps/:
    post:
      operationId: decks_cards_swaps_create
      description: 'Spec 005, AC-9: a Maybeboard candidate to replace this card.'
      parameters:
      - in: path
        name: card_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapProposal'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SwapProposal'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SwapProposal'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
  /api/decks/{id}/cards/{card_id}/swaps/{out_id}/:
    delete:
      operationId: decks_cards_swaps_destroy
      description: 'Spec 021, AC-16: drop a pair; the cards stay.'
      parameters:
      - in: path
        name: card_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: out_id
        schema:
          type: integer
        required: true
      tags:
      - decks
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/decks/{id}/combos/:
    get:
      operationId: decks_combos_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckCombos'
          description: ''
  /api/decks/{id}/delete/:
    post:
      operationId: decks_delete_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckDelete'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeckDelete'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeckDelete'
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/decks/{id}/export/:
    get:
      operationId: decks_export_retrieve
      parameters:
      - in: query
        name: categories
        schema:
          type: boolean
          default: true
        description: 'Write categories as #tags (spec 014, AC-4)'
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: printings
        schema:
          type: boolean
          default: true
        description: Write set and number (spec 014, AC-3)
      - in: query
        name: tokens
        schema:
          type: boolean
          default: false
        description: End with a Tokens section (spec 015, AC-8)
      tags:
      - decks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResult'
          description: ''
  /api/decks/{id}/import/:
    post:
      operationId: decks_import_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckText'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeckText'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeckText'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
  /api/decks/{id}/missing/:
    get:
      operationId: decks_missing_retrieve
      parameters:
      - in: query
        name: color
        schema:
          type: array
          items:
            type: string
      - in: query
        name: condition
        schema:
          type: array
          items:
            type: string
      - in: query
        name: deck
        schema:
          type: string
      - in: query
        name: dir
        schema:
          type: string
      - in: query
        name: finish
        schema:
          type: array
          items:
            type: string
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: limit
        schema:
          type: string
      - in: query
        name: location
        schema:
          type: string
      - in: query
        name: offset
        schema:
          type: string
      - in: query
        name: price_max
        schema:
          type: string
      - in: query
        name: price_min
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: rarity
        schema:
          type: array
          items:
            type: string
      - in: query
        name: set
        schema:
          type: array
          items:
            type: string
      - in: query
        name: sort
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: array
          items:
            type: string
      tags:
      - decks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicItemPage'
          description: ''
  /api/decks/{id}/missing/export/:
    post:
      operationId: decks_missing_export_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissingExport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MissingExport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MissingExport'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResult'
          description: ''
  /api/decks/{id}/optimize/:
    get:
      operationId: decks_optimize_retrieve
      description: Cheapest printings for the cards this deck lacks (spec 013).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizePreview'
          description: ''
    post:
      operationId: decks_optimize_create
      description: Cheapest printings for the cards this deck lacks (spec 013).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeApply'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OptimizeApply'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OptimizeApply'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
  /api/decks/{id}/swaps/:
    post:
      operationId: decks_swaps_create
      description: 'Spec 021, AC-14: propose a swap between a deck card and a Maybeboard
        or new card.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Pair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Pair'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
  /api/decks/{id}/token-printing/:
    post:
      operationId: decks_token_printing_create
      description: 'Spec 021, AC-10: the printing a deck shows for a kind of token.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPrintingChoice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenPrintingChoice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenPrintingChoice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
  /api/decks/{id}/want-missing/:
    post:
      operationId: decks_want_missing_create
      description: A deck's missing cards onto the want list, for the deck (AC-15,
        AC-16).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WantMissingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WantMissingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WantMissingRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WantMissingResult'
          description: ''
  /api/decks/add-from-collection/:
    post:
      operationId: decks_add_from_collection_create
      description: 'AC-10: one copy of each selected card, into a deck''s zone.'
      tags:
      - decks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFromCollection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddFromCollection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddFromCollection'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddResult'
          description: ''
  /api/decks/categories/:
    get:
      operationId: decks_categories_retrieve
      description: 'Spec 006, AC-13: category names to suggest.'
      tags:
      - decks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuggestions'
          description: ''
  /api/decks/import/preview/:
    post:
      operationId: decks_import_preview_create
      tags:
      - decks
      requestBody:
        content:
