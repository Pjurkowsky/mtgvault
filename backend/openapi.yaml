openapi: 3.0.3
info:
  title: MTG Vault API
  version: 0.1.0
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          description: Wrong username/email or password.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Swap the refresh cookie for a new access token and a rotated cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          description: Not logged in
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/catalog/cards/:
    get:
      operationId: catalog_cards_list
      description: Card names matching `q`, one entry per card (not per printing).
      parameters:
      - in: query
        name: q
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardSearchResult'
          description: ''
  /api/catalog/cards/{oracle_id}/:
    get:
      operationId: catalog_cards_retrieve
      description: A card with its printings and how many copies the viewer owns.
      parameters:
      - in: path
        name: oracle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDetail'
          description: ''
  /api/catalog/cards/{oracle_id}/edhrec/:
    get:
      operationId: catalog_cards_edhrec_retrieve
      description: 'EDHREC tabs for a card, cached 24 h. Never fails: no data = available
        false.'
      parameters:
      - in: path
        name: oracle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edhrec'
          description: ''
  /api/catalog/cards/{oracle_id}/printings/:
    get:
      operationId: catalog_cards_printings_list
      parameters:
      - in: path
        name: oracle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Printing'
          description: ''
  /api/catalog/sets/:
    get:
      operationId: catalog_sets_list
      parameters:
      - in: query
        name: q
        schema:
          type: string
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Set'
          description: ''
  /api/catalog/status/:
    get:
      operationId: catalog_status_retrieve
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogStatus'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/imports/commit/:
    post:
      operationId: imports_commit_create
      description: Parses the text again (never trusts the preview) and saves all
        rows at once (AC-49).
      tags:
      - imports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
          description: ''
  /api/imports/preview/:
    post:
      operationId: imports_preview_create
      tags:
      - imports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreview'
          description: ''
  /api/items/:
    get:
      operationId: items_list
      parameters:
      - in: query
        name: color
        schema:
          type: array
          items:
            type: string
      - in: query
        name: condition
        schema:
          type: array
          items:
            type: string
      - in: query
        name: dir
        schema:
          type: string
      - in: query
        name: finish
        schema:
          type: array
          items:
            type: string
      - in: query
        name: limit
        schema:
          type: string
      - in: query
        name: location
        schema:
          type: string
      - in: query
        name: offset
        schema:
          type: string
      - in: query
        name: price_max
        schema:
          type: string
      - in: query
        name: price_min
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: rarity
        schema:
          type: array
          items:
            type: string
      - in: query
        name: set
        schema:
          type: array
          items:
            type: string
      - in: query
        name: sort
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: array
          items:
            type: string
      tags:
      - items
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
          description: ''
    post:
      operationId: items_create
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ItemWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ItemWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemSaveResult'
          description: ''
  /api/items/{id}/:
    get:
      operationId: items_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
    patch:
      operationId: items_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedItemWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedItemWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedItemWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemSaveResult'
          description: ''
    delete:
      operationId: items_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/items/bulk/:
    post:
      operationId: items_bulk_create
      description: Move, edit or delete many rows (AC-38 to AC-43). dry_run only counts.
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
          description: ''
  /api/items/export/:
    post:
      operationId: items_export_create
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExportRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResult'
          description: ''
  /api/locations/:
    get:
      operationId: locations_list
      tags:
      - locations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
          description: ''
    post:
      operationId: locations_create
      tags:
      - locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Location'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Location'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
  /api/locations/{id}/:
    get:
      operationId: locations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - locations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
    patch:
      operationId: locations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLocation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLocation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLocation'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
  /api/locations/{id}/delete/:
    post:
      operationId: locations_delete_create
      description: Delete a location, deciding what happens to its cards (AC-11).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationDelete'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LocationDelete'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocationDelete'
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/me/:
    get:
      operationId: me_retrieve
      description: The logged-in user's account. PATCH changes only the currency.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      description: The logged-in user's account. PATCH changes only the currency.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMe'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/me/password/:
    post:
      operationId: me_password_create
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/users/:
    get:
      operationId: users_list
      parameters:
      - in: query
        name: q
        schema:
          type: string
      tags:
      - users
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryUser'
          description: ''
  /api/users/{username}/:
    get:
      operationId: users_retrieve
      parameters:
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
          description: ''
  /api/users/{username}/locations/:
    get:
      operationId: users_locations_list
      parameters:
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLocationList'
          description: ''
  /api/users/{username}/locations/{id}/:
    get:
      operationId: users_locations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLocation'
          description: ''
  /api/users/{username}/locations/{id}/export/:
    post:
      operationId: users_locations_export_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicExportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicExportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicExportRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResult'
          description: ''
  /api/users/{username}/locations/{id}/items/:
    get:
      operationId: users_locations_items_retrieve
      parameters:
      - in: query
        name: color
        schema:
          type: array
          items:
            type: string
      - in: query
        name: condition
        schema:
          type: array
          items:
            type: string
      - in: query
        name: dir
        schema:
          type: string
      - in: query
        name: finish
        schema:
          type: array
          items:
            type: string
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: limit
        schema:
          type: string
      - in: query
        name: location
        schema:
          type: string
      - in: query
        name: offset
        schema:
          type: string
      - in: query
        name: price_max
        schema:
          type: string
      - in: query
        name: price_min
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: rarity
        schema:
          type: array
          items:
            type: string
      - in: query
        name: set
        schema:
          type: array
          items:
            type: string
      - in: query
        name: sort
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: array
          items:
            type: string
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicItemPage'
          description: ''
components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    ActionEnum:
      enum:
      - move
      - edit
      - delete
      type: string
      description: |-
        * `move` - move
        * `edit` - edit
        * `delete` - delete
    AuthResponse:
      type: object
      description: Body returned by register and login. The refresh token goes in
        a cookie.
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - user
    BlankEnum:
      enum:
      - ''
    BulkChanges:
      type: object
      properties:
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        language:
          $ref: '#/components/schemas/LanguageEnum'
        finish:
          $ref: '#/components/schemas/FinishEnum'
    BulkRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        selection:
          $ref: '#/components/schemas/Selection'
        location:
          type: integer
          nullable: true
          description: Target for move; null = Unfiled
        changes:
          $ref: '#/components/schemas/BulkChanges'
        dry_run:
          type: boolean
          default: false
      required:
      - action
      - selection
    BulkResult:
      type: object
      properties:
        rows:
          type: integer
        cards:
          type: integer
        skipped:
          type: integer
          description: Rows left unchanged (e.g. finish not available)
      required:
      - cards
      - rows
      - skipped
    CardDetail:
      type: object
      properties:
        oracle_id:
          type: string
          format: uuid
        name:
          type: string
        owned:
          type: integer
          description: Copies the viewer owns across printings (0 when logged out)
        printings:
          type: array
          items:
            $ref: '#/components/schemas/Printing'
      required:
      - name
      - oracle_id
      - owned
      - printings
    CardSearchResult:
      type: object
      properties:
        oracle_id:
          type: string
          format: uuid
        name:
          type: string
        image_small:
          type: string
      required:
      - image_small
      - name
      - oracle_id
    CardsEnum:
      enum:
      - move
      - unfile
      - delete
      type: string
      description: |-
        * `move` - move
        * `unfile` - unfile
        * `delete` - delete
    CatalogStatus:
      type: object
      properties:
        prices_updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - prices_updated_at
    ColorEnum:
      enum:
      - W
      - U
      - B
      - R
      - G
      - C
      type: string
      description: |-
        * `W` - W
        * `U` - U
        * `B` - B
        * `R` - R
        * `G` - G
        * `C` - C
    ConditionEnum:
      enum:
      - NM
      - LP
      - MP
      - HP
      - DMG
      type: string
      description: |-
        * `NM` - Near Mint
        * `LP` - Lightly Played
        * `MP` - Moderately Played
        * `HP` - Heavily Played
        * `DMG` - Damaged
    CurrencyEnum:
      enum:
      - USD
      - EUR
      - PLN
      type: string
      description: |-
        * `USD` - US Dollar
        * `EUR` - Euro
        * `PLN` - Polish Złoty
    DirEnum:
      enum:
      - asc
      - desc
      type: string
      description: |-
        * `asc` - asc
        * `desc` - desc
    DirectoryUser:
      type: object
      properties:
        username:
          type: string
        public_locations:
          type: integer
      required:
      - public_locations
      - username
    Edhrec:
      type: object
      properties:
        available:
          type: boolean
        commanders:
          type: array
          items:
            $ref: '#/components/schemas/EdhrecCommander'
        played_with:
          type: array
          items:
            $ref: '#/components/schemas/EdhrecGroup'
        similar:
          type: array
          items:
            $ref: '#/components/schemas/EdhrecCard'
      required:
      - available
      - commanders
      - played_with
      - similar
    EdhrecCard:
      type: object
      properties:
        name:
          type: string
        oracle_id:
          type: string
          format: uuid
          nullable: true
          description: Null when the card is not in our catalog
        image_small:
          type: string
        image_normal:
