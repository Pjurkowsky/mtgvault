          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        ding_high:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        show_total:
          type: boolean
        locked_sets:
          type: array
          items:
            type: string
            maxLength: 10
        glare_hint:
          type: boolean
        glare_sensitivity:
          type: integer
          maximum: 100
          minimum: 0
        combine_frames:
          type: boolean
        suggest_guesses:
          type: boolean
    ScannerSource:
      type: object
      description: Where the recognition model comes from (spec 020). Staff only.
      properties:
        kind:
          $ref: '#/components/schemas/ScannerSourceKindEnum'
        repo:
          type: string
          description: owner/name, for GitHub releases
          maxLength: 200
        path:
          type: string
          description: Absolute folder of bundles on the server
          maxLength: 500
        installed:
          allOf:
          - $ref: '#/components/schemas/InstalledBundle'
          readOnly: true
          nullable: true
        syncing:
          type: boolean
          readOnly: true
        last_sync_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_error:
          type: string
          readOnly: true
      required:
      - installed
      - last_error
      - last_sync_at
      - syncing
    ScannerSourceKindEnum:
      enum:
      - github
      - folder
      type: string
      description: |-
        * `github` - GitHub releases
        * `folder` - Server folder
    ScannerSourceRequest:
      type: object
      description: What staff send when saving the source (schema only; validated
        by ScannerSourceSerializer).
      properties:
        kind:
          $ref: '#/components/schemas/ScannerSourceKindEnum'
        repo:
          type: string
          description: owner/name, for GitHub releases
        path:
          type: string
          description: Absolute folder of bundles on the server
      required:
      - kind
    Selection:
      type: object
      description: Either explicit ids, or every row matching a filter minus exclusions
        (AC-39).
      properties:
        ids:
          type: array
          items:
            type: integer
        filter:
          $ref: '#/components/schemas/ItemFilter'
        exclude_ids:
          type: array
          items:
            type: integer
    Set:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
        name:
          type: string
          maxLength: 200
      required:
      - code
      - name
    SortEnum:
      enum:
      - name
      - set
      - rarity
      - price
      - quantity
      - added
      - color
      - mana_value
      type: string
      description: |-
        * `name` - name
        * `set` - set
        * `rarity` - rarity
        * `price` - price
        * `quantity` - quantity
        * `added` - added
        * `color` - color
        * `mana_value` - mana_value
    SoundEnum:
      enum:
      - click
      - ding
      - big_ding
      type: string
      description: |-
        * `click` - click
        * `ding` - ding
        * `big_ding` - big_ding
    Stats:
      type: object
      properties:
        curve:
          type: object
          additionalProperties:
            type: integer
        pips:
          type: object
          additionalProperties:
            type: integer
        types:
          type: object
          additionalProperties:
            type: integer
        average_mana_value:
          type: number
          format: double
        value:
          $ref: '#/components/schemas/ValueSplit'
        values:
          $ref: '#/components/schemas/ValuesSplit'
      required:
      - average_mana_value
      - curve
      - pips
      - types
      - value
      - values
    SwapProposal:
      type: object
      properties:
        printing:
          type: string
          format: uuid
          description: The card to propose
      required:
      - printing
    Token:
      type: object
      description: A token, emblem or marker a card makes (spec 015).
      properties:
        id:
          type: string
          format: uuid
        oracle_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        type_line:
          type: string
        set_code:
          type: string
        collector_number:
          type: string
        image_small:
          type: string
        image_normal:
          type: string
        image_large:
          type: string
      required:
      - collector_number
      - id
      - image_large
      - image_normal
      - image_small
      - name
      - oracle_id
      - set_code
      - type_line
    TokenPrinting:
      type: object
      description: |-
        A printing of a token, with the fields the printing picker reads (spec 021, AC-10).
        Needs `currency` and `rates` in the context.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        set_code:
          type: string
        set_name:
          type: string
        collector_number:
          type: string
        finishes:
          type: array
          items:
            $ref: '#/components/schemas/FinishEnum'
        image_small:
          type: string
        image_normal:
          type: string
        image_large:
          type: string
        prices:
          allOf:
          - $ref: '#/components/schemas/Prices'
          readOnly: true
        prices_all:
          allOf:
          - $ref: '#/components/schemas/PricesAll'
          readOnly: true
      required:
      - collector_number
      - finishes
      - id
      - image_large
      - image_normal
      - image_small
      - name
      - prices
      - prices_all
      - set_code
      - set_name
    TokenPrintingChoice:
      type: object
      properties:
        kind:
          type: string
        token:
          type: string
          format: uuid
          nullable: true
          description: Null goes back to the first maker's art
      required:
      - kind
      - token
    Totals:
      type: object
      properties:
        card_count:
          type: integer
        value:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        values:
          $ref: '#/components/schemas/Money'
      required:
      - card_count
      - value
      - values
    TypeEnum:
      enum:
      - Artifact
      - Battle
      - Creature
      - Enchantment
      - Instant
      - Kindred
      - Land
      - Planeswalker
      - Sorcery
      - Tribal
      type: string
      description: |-
        * `Artifact` - Artifact
        * `Battle` - Battle
        * `Creature` - Creature
        * `Enchantment` - Enchantment
        * `Instant` - Instant
        * `Kindred` - Kindred
        * `Land` - Land
        * `Planeswalker` - Planeswalker
        * `Sorcery` - Sorcery
        * `Tribal` - Tribal
    UndoRequest:
      type: object
      properties:
        slot:
          type: integer
          description: 'Scan in order: free this pocket too (spec 007, AC-22)'
    UndoResult:
      type: object
      properties:
        remaining:
          type: integer
          description: Copies left in the row (0 = removed)
        totals:
          allOf:
          - $ref: '#/components/schemas/Totals'
          description: Totals of the row's cart or location
      required:
      - remaining
      - totals
    Unplaced:
      type: object
      properties:
        item:
          type: integer
        count:
          type: integer
      required:
      - count
      - item
    ValueSplit:
      type: object
      properties:
        total:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        owned:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        missing:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
      required:
      - missing
      - owned
      - total
    ValuesSplit:
      type: object
      properties:
        total:
          $ref: '#/components/schemas/Money'
        owned:
          $ref: '#/components/schemas/Money'
        missing:
          $ref: '#/components/schemas/Money'
      required:
      - missing
      - owned
      - total
    Want:
      type: object
      description: 'What visitors see of a public want list (AC-18): no decks.'
      properties:
        id:
          type: integer
          readOnly: true
        printing:
          $ref: '#/components/schemas/PrintingBrief'
        any_printing:
          type: boolean
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        finish:
          allOf:
          - $ref: '#/components/schemas/WantFinishEnum'
          readOnly: true
        unit_price:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
          nullable: true
        unit_prices:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
          description: Price per copy in every currency
        deck:
          type: integer
          readOnly: true
          nullable: true
        deck_name:
          type: string
          readOnly: true
          nullable: true
        deck_location:
          type: integer
          readOnly: true
          nullable: true
          description: The linked deck's box, where Add to collection puts copies
        added_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - added_at
      - any_printing
      - deck
      - deck_location
      - deck_name
      - finish
      - id
      - printing
      - quantity
      - unit_price
      - unit_prices
    WantFinishEnum:
      enum:
      - any
      - nonfoil
      - foil
      - etched
      type: string
      description: |-
        * `any` - Any
        * `nonfoil` - Nonfoil
        * `foil` - Foil
        * `etched` - Etched
    WantMissingRequest:
      type: object
      properties:
        card:
          type: integer
          description: One deck card; omit for every missing card
    WantMissingResult:
      type: object
      properties:
        added:
          type: integer
          description: Copies put on the want list
        deck:
          $ref: '#/components/schemas/DeckDetail'
      required:
      - added
      - deck
    WantPage:
      type: object
      properties:
        currency:
          type: string
        prices_updated_at:
          type: string
          format: date-time
          nullable: true
        count:
          type: integer
          description: Matching entries
        total_quantity:
          type: integer
          description: Cards in matching entries
        total_value:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        total_values:
          $ref: '#/components/schemas/Money'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Want'
      required:
      - count
      - currency
      - prices_updated_at
      - results
      - total_quantity
      - total_value
      - total_values
    WantSaveResult:
      type: object
      properties:
        want:
          $ref: '#/components/schemas/Want'
        merged:
          type: boolean
        wanted:
          type: integer
          description: Copies of this card on the want list now
      required:
      - merged
      - want
      - wanted
    WantSettings:
      type: object
      properties:
        is_public:
          type: boolean
      required:
      - is_public
    WantWrite:
      type: object
      properties:
        printing:
          type: string
          format: uuid
          description: Scryfall id
        any_printing:
          type: boolean
          default: true
          description: False pins `printing`
        finish:
          allOf:
          - $ref: '#/components/schemas/WantFinishEnum'
          default: any
        deck:
          type: integer
          nullable: true
          description: The deck this card is for
        quantity:
          type: integer
          maximum: 999
          minimum: 1
          default: 1
      required:
      - printing
    ZoneEnum:
      enum:
      - commander
      - main
      - side
      - maybe
      type: string
      description: |-
        * `commander` - Commander
        * `main` - Mainboard
        * `side` - Sideboard
        * `maybe` - Maybeboard
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
