openapi: 3.0.3
info:
  title: MTG Vault API
  version: 0.1.0
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          description: Wrong username/email or password.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Swap the refresh cookie for a new access token and a rotated cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          description: Not logged in
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/catalog/cards/:
    get:
      operationId: catalog_cards_list
      description: Card names matching `q`, one entry per card (not per printing).
      parameters:
      - in: query
        name: q
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardSearchResult'
          description: ''
  /api/catalog/cards/{oracle_id}/printings/:
    get:
      operationId: catalog_cards_printings_list
      parameters:
      - in: path
        name: oracle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Printing'
          description: ''
  /api/catalog/sets/:
    get:
      operationId: catalog_sets_list
      parameters:
      - in: query
        name: q
        schema:
          type: string
      tags:
      - catalog
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Set'
          description: ''
  /api/catalog/status/:
    get:
      operationId: catalog_status_retrieve
      tags:
      - catalog
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogStatus'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      description: The logged-in user's account. PATCH changes only the currency.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      description: The logged-in user's account. PATCH changes only the currency.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMe'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/me/password/:
    post:
      operationId: me_password_create
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/users/{username}/:
    get:
      operationId: users_retrieve
      parameters:
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
          description: ''
components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AuthResponse:
      type: object
      description: Body returned by register and login. The refresh token goes in
        a cookie.
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - user
    CardSearchResult:
      type: object
      properties:
        oracle_id:
          type: string
          format: uuid
        name:
          type: string
        image_small:
          type: string
      required:
      - image_small
      - name
      - oracle_id
    CatalogStatus:
      type: object
      properties:
        prices_updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - prices_updated_at
    CurrencyEnum:
      enum:
      - USD
      - EUR
      - PLN
      type: string
      description: |-
        * `USD` - US Dollar
        * `EUR` - Euro
        * `PLN` - Polish Złoty
    FinishesEnum:
      enum:
      - nonfoil
      - foil
      - etched
      type: string
      description: |-
        * `nonfoil` - Nonfoil
        * `foil` - Foil
        * `etched` - Etched
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Login:
      type: object
      properties:
        login:
          type: string
          description: Username or email
        password:
          type: string
      required:
      - login
      - password
    Me:
      type: object
      description: The logged-in user's own account data.
      properties:
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - currency
      - date_joined
      - email
      - username
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
      required:
      - current_password
      - new_password
    PatchedMe:
      type: object
      description: The logged-in user's own account data.
      properties:
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        date_joined:
          type: string
          format: date-time
          readOnly: true
    Prices:
      type: object
      description: Price per copy for each finish, in the viewer's currency. Null
        = no price.
      properties:
        nonfoil:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        foil:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        etched:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
      required:
      - etched
      - foil
      - nonfoil
    Printing:
      type: object
      description: A printing with prices. Needs `currency` and `rates` in the context.
      properties:
        id:
          type: string
          format: uuid
          description: Scryfall id
        oracle_id:
          type: string
          format: uuid
          description: Same for every printing of a card
        name:
          type: string
          maxLength: 300
        set_code:
          type: string
        set_name:
          type: string
        collector_number:
          type: string
          maxLength: 20
        released_at:
          type: string
          format: date
        rarity:
          $ref: '#/components/schemas/RarityEnum'
        colors:
          type: array
          items:
            type: string
            maxLength: 1
        type_line:
          type: string
          maxLength: 300
        mana_cost:
          type: string
          maxLength: 100
        finishes:
          type: array
          items:
            $ref: '#/components/schemas/FinishesEnum'
        image_small:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        image_normal:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        image_large:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        prices:
          allOf:
          - $ref: '#/components/schemas/Prices'
          readOnly: true
      required:
      - collector_number
      - id
      - name
      - oracle_id
      - prices
      - rarity
      - released_at
      - set_code
      - set_name
    PublicUser:
      type: object
      description: What anyone may see about a user. Never add private fields here.
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9_-]{3,30}$
          maxLength: 30
        date_joined:
          type: string
          format: date-time
      required:
      - username
    RarityEnum:
      enum:
      - common
      - uncommon
      - rare
      - mythic
      - special
      - bonus
      type: string
      description: |-
        * `common` - Common
        * `uncommon` - Uncommon
        * `rare` - Rare
        * `mythic` - Mythic
        * `special` - Special
        * `bonus` - Bonus
    Register:
      type: object
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9_-]{3,30}$
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
      required:
      - currency
      - email
      - password
      - username
    Set:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
        name:
          type: string
          maxLength: 200
      required:
      - code
      - name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
