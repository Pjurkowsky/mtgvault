openapi: 3.0.3
info:
  title: MTG Vault API
  version: 0.1.0
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          description: Wrong username/email or password.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Swap the refresh cookie for a new access token and a rotated cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          description: Not logged in
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      description: The logged-in user's account. PATCH changes only the currency.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      description: The logged-in user's account. PATCH changes only the currency.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMe'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/me/password/:
    post:
      operationId: me_password_create
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/users/{username}/:
    get:
      operationId: users_retrieve
      parameters:
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
          description: ''
components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AuthResponse:
      type: object
      description: Body returned by register and login. The refresh token goes in
        a cookie.
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - user
    CurrencyEnum:
      enum:
      - USD
      - EUR
      - PLN
      type: string
      description: |-
        * `USD` - US Dollar
        * `EUR` - Euro
        * `PLN` - Polish Złoty
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Login:
      type: object
      properties:
        login:
          type: string
          description: Username or email
        password:
          type: string
      required:
      - login
      - password
    Me:
      type: object
      description: The logged-in user's own account data.
      properties:
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - currency
      - date_joined
      - email
      - username
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
      required:
      - current_password
      - new_password
    PatchedMe:
      type: object
      description: The logged-in user's own account data.
      properties:
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        date_joined:
          type: string
          format: date-time
          readOnly: true
    PublicUser:
      type: object
      description: What anyone may see about a user. Never add private fields here.
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9_-]{3,30}$
          maxLength: 30
        date_joined:
          type: string
          format: date-time
      required:
      - username
    Register:
      type: object
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9_-]{3,30}$
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
      required:
      - currency
      - email
      - password
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
