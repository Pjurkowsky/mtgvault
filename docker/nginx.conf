# Self-hosted image (spec 008): serves the frontend and proxies Django on
# 127.0.0.1:8000. The owner's reverse proxy terminates https.

# Keep the scheme the reverse proxy saw (AC-14); fall back to our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    root /srv/frontend;
    index index.html;
    client_max_body_size 20m;
    access_log /dev/stdout;

    # Fast scanning (spec 003, AC-16): see vite.config.ts scanIsolation().
    add_header Cross-Origin-Embedder-Policy credentialless always;

    location = /scan/fast {
        add_header Cross-Origin-Embedder-Policy credentialless always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        try_files /index.html =404;
    }

    # Django: API, admin and its static files
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }

    # SPA fallback for Vue Router
    location / {
        add_header Cross-Origin-Embedder-Policy credentialless always;
        try_files $uri $uri/ /index.html;
    }
}
