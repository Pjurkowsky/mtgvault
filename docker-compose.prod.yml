# Production: gunicorn backend, nginx serving the built frontend.
#   docker compose -f docker-compose.prod.yml up --build -d
name: mtgvault-prod

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "False"
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-True}
      # Explicit, so a mounted backend/.env (pointing at localhost) never wins.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SCANNER_DIR: /data/scanner
    volumes:
      - scanner:/data/scanner  # recognition models (spec 003)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A config worker --loglevel=info
    env_file: .env
    environment:
      DEBUG: "False"
      # Explicit, so a mounted backend/.env (pointing at localhost) never wins.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SCANNER_DIR: /data/scanner
    restart: unless-stopped
    volumes:
      - scanner:/data/scanner  # recognition models (spec 003)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment:
      DEBUG: "False"
      # Explicit, so a mounted backend/.env (pointing at localhost) never wins.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  scanner:
